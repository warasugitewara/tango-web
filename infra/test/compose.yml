# 統合テスト専用のPostgreSQL。本番の名前・ポート・シークレットとは一切共有しない。
name: tango-test

services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: tango-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tango_test
      POSTGRES_USER: tango_test
      # テスト専用の固定値。本番のシークレット経路とは無関係。
      POSTGRES_PASSWORD: tango_test
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      # ループバックのみに公開する。LAN/WANへは決して晒さない。
      - '127.0.0.1:55432:5432'
    volumes:
      # PostgreSQL 18 以降 VOLUME は /var/lib/postgresql (PGDATA は /var/lib/postgresql/18/docker)
      - tango-test-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tango_test -d tango_test']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  tango-test-pgdata:
    name: tango-test-pgdata
